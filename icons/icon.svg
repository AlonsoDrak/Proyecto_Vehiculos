<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor squircle profundo -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- 1. RETÍCULA DE BÚSQUEDA Y DIAGNÓSTICO (FIND / SCAN) -->
  <g id="finder-hud">
    <!-- Círculo de radar exterior tenue -->
    <circle cx="256" cy="226" r="142" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8, 10" />
    
    <!-- Lente / Retícula óptica principal -->
    <circle cx="256" cy="226" r="118" fill="rgba(14, 165, 233, 0.03)" stroke="url(#cyanGlow)" stroke-width="3.5" stroke-opacity="0.85" filter="url(#glow)" />

    <!-- Marcas de calibración / Ticks ortogonales -->
    <line x1="256" y1="94" x2="256" y2="114" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="256" y1="338" x2="256" y2="358" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="124" y1="226" x2="144" y2="226" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="368" y1="226" x2="388" y2="226" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

    <!-- Corchetes angulares de enfoque HUD -->
    <path d="M 162,154 L 146,154 L 146,170" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 350,154 L 366,154 L 366,170" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 146,282 L 146,298 L 162,298" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M 366,282 L 366,298 L 350,298" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 2. SILUETA AERODINÁMICA MINIMALISTA DEL VEHÍCULO (AUTO) -->
  <g id="car-silhouette">
    <!-- Línea de techo y carrocería fluida aerodinámica -->
    <path d="M 162,246 C 176,242 198,232 222,210 C 242,192 268,188 296,190 C 322,192 342,206 352,222 C 360,234 368,240 376,244 L 372,252 C 362,252 352,252 344,252 C 341,238 328,228 314,230 C 300,232 290,245 292,252 L 220,252 C 217,238 204,228 190,230 C 176,232 166,245 168,252 Z" 
          fill="url(#cyanGlow)" filter="url(#glow)" />

    <!-- Ventana / Cabina de cristal minimalista -->
    <path d="M 230,211 C 244,198 266,195 292,197 C 312,199 326,208 335,221 L 236,221 Z" 
          fill="#080c15" />

    <!-- Rueda Delantera deportiva -->
    <circle cx="201" cy="252" r="17" fill="#080c15" stroke="url(#cyanGlow)" stroke-width="3" />
    <circle cx="201" cy="252" r="5" fill="#38bdf8" />

    <!-- Rueda Trasera deportiva -->
    <circle cx="311" cy="252" r="17" fill="#080c15" stroke="url(#cyanGlow)" stroke-width="3" />
    <circle cx="311" cy="252" r="5" fill="#38bdf8" />

    <!-- Haz de escaneo láser / Punto focal de detección -->
    <circle cx="256" cy="226" r="4" fill="#ffffff" filter="url(#glow)" />
    <line x1="218" y1="226" x2="294" y2="226" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4, 4" opacity="0.8" />
  </g>

  <!-- 3. TIPOGRAFÍA MINIMALISTA AUTOFIND -->
  <text x="256" y="435" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="8">AUTOFIND</text>
  <text x="256" y="462" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="5">LAB</text>
</svg>