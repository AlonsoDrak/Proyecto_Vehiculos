<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo degrade profundo calidad retina -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#08223d" />
    </linearGradient>

    <!-- Gradiente cian neón de alta luminiscencia -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Gradiente vidrio cabina -->
    <linearGradient id="cabinGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#041226" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradiente carrocería -->
    <linearGradient id="bodyMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172b4d" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Contenedor squircle perfecto -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" />

  <!-- RETÍCULA HUD DE PRECISIÓN (FINDER) - Centro exacto: (256, 256) -->
  <g id="finder-scope">
    <!-- Círculo de radar exterior fino -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8, 12" />

    <!-- Lente de enfoque óptico principal con brillo cian -->
    <circle cx="256" cy="256" r="150" fill="rgba(14, 165, 233, 0.03)" stroke="url(#neonCyan)" stroke-width="2" stroke-opacity="0.45" />

    <!-- 4 Ticks ortogonales cardinales de alta precisión (100% simétricos) -->
    <line x1="256" y1="88" x2="256" y2="114" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="398" x2="256" y2="424" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="88" y1="256" x2="114" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="398" y1="256" x2="424" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Corchetes angulares HUD en las 4 esquinas del radar -->
    <path d="M 136,168 L 120,168 L 120,184" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 376,168 L 392,168 L 392,184" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 120,328 L 120,344 L 136,344" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 392,328 L 392,344 L 376,344" stroke="#00f2fe" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- SILUETA HIPERDEPORTIVA FRONTAL (100% Simétrica sobre eje vertical X = 256) -->
  <g id="hypercar-silhouette">
    <!-- Aura lumínica ambiental -->
    <ellipse cx="256" cy="272" rx="140" ry="46" fill="#00f2fe" fill-opacity="0.12" filter="url(#softAura)" />

    <!-- 1. Cúpula de Cabina / Parabrisas Aerodinámico -->
    <path d="M 214,186 
             C 232,180 280,180 298,186 
             C 318,192 338,216 352,240 
             C 300,234 212,234 160,240 
             C 174,216 194,192 214,186 Z" 
          fill="url(#cabinGlass)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />

    <!-- Pilares A elegantes -->
    <line x1="228" y1="188" x2="186" y2="238" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="284" y1="188" x2="326" y2="238" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- 2. Carrocería Esculpida y Hombros Anchos -->
    <path d="M 256,232 
             C 292,232 344,236 364,244 
             C 382,252 390,264 390,278 
             C 390,296 376,306 354,306 
             L 342,306 
             L 336,298 
             L 176,298 
             L 170,306 
             L 158,306 
             C 136,306 122,296 122,278 
             C 122,264 130,252 148,244 
             C 168,236 220,232 256,232 Z" 
          fill="url(#bodyMetallic)" stroke="url(#neonCyan)" stroke-width="2.5" />

    <!-- Neumáticos anchos en los extremos -->
    <rect x="124" y="278" width="16" height="26" rx="4" fill="#040813" stroke="#1e293b" stroke-width="1.5" />
    <rect x="372" y="278" width="16" height="26" rx="4" fill="#040813" stroke="#1e293b" stroke-width="1.5" />

    <!-- 3. Splitter Aerodinámico Inferior -->
    <path d="M 166,308 L 346,308 L 354,314 L 158,314 Z" fill="#030712" stroke="#0ea5e9" stroke-width="1" />

    <!-- 4. Barra de Luz Continua DRL Láser (Línea pura sin marcas raras) -->
    <line x1="140" y1="264" x2="372" y2="264" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

    <!-- Faros Matrix LED en los extremos -->
    <polygon points="140,260 190,259 184,268 142,268" fill="#ffffff" filter="url(#glow)" />
    <polygon points="372,260 322,259 328,268 370,268" fill="#ffffff" filter="url(#glow)" />

    <!-- Entrada de refrigeración inferior -->
    <polygon points="216,280 296,280 286,296 226,296" fill="#040711" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8" />
  </g>
</svg>